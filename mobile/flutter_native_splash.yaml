# flutter_native_splash configuration
# Run: dart run flutter_native_splash:create

flutter_native_splash:
  color: "#F15722"
  android: true
  ios: false

  # Pre-Android 12: full image centered, no circular mask
  image: "assets/splash/ag-splash.png"

  # Android 12+: skip image entirely (avoids forced circular crop)
  # Flutter splash screen takes over almost immediately anyway
  android_12:
    color: "#F15722"
