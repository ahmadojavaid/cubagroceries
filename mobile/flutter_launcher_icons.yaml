# flutter_launcher_icons configuration
# Run: dart run flutter_launcher_icons

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/ag-icon.png"
  adaptive_icon_background: "#F15722"
  adaptive_icon_foreground: "assets/icon/ag-icon.png"
  min_sdk_android: 21
