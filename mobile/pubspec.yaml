name: cubagroceries
description: "Cuba Groceries — Customer mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.9.1

  # Routing
  go_router: ^17.1.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Secure Storage
  flutter_secure_storage: ^10.0.0

  # Local Storage (cart persistence)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Image Caching
  cached_network_image: ^3.4.1

  # UI Utilities
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
